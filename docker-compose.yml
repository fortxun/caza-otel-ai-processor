version: '3.8'
services:
  idop:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/etc/idop/config
    environment:
      - CONFIG_PATH=/etc/idop/config/config.yaml
    restart: unless-stopped
    networks:
      - idop-network

  # For local development/testing, you can uncomment this to run a local PMM instance
  # pmm:
  #   image: percona/pmm-server:latest
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     - METRICS_RESOLUTION=1s
  #     - METRICS_RETENTION=72h
  #   volumes:
  #     - pmm-data:/srv
  #   networks:
  #     - idop-network

networks:
  idop-network:
    driver: bridge

