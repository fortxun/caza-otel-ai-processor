
pmm:
  url: "http://localhost:80"
  username: "admin"
  password: "admin"
  timeout: "30s"

analysis:
  enabled: true
  anomaly_threshold: 2.0
  sensitivity_level: "medium"
  min_data_points: 10
  adaptive_baseline: true
  adaptive_rate: 0.1

alerting:
  enabled: true
  slack:
    webhook_url: ""
    channel: "#alerts"
    username: "IDOP Alert Bot"
  email:
    smtp_host: ""
    smtp_port: 587
    from: "idop@company.com"
    to: []
    username: ""
    password: ""
    use_tls: true

server:
  host: "0.0.0.0"
  port: 8080
  metrics_interval: "1m"

llm:
  enabled: true
  provider: "gemini"
  model: "gemini-pro"
  api_key: "${GEMINI_API_KEY}"
  max_tokens: 1024
  temperature: 0.7
  cache_enabled: true
  cache_size: 100
  cache_ttl: "1h"
